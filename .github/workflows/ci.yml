name: HW2 CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homework/hw2/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Run unit tests
        run: go test ./...
      - name: Build image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::12} -t hw2-app:${GITHUB_SHA} .
