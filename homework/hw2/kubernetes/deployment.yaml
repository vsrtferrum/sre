apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw2-app
  labels:
    app: hw2-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hw2-app
  template:
    metadata:
      labels:
        app: hw2-app
    spec:
      containers:
        - name: hw2-app
          image: hw2-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 8081
          env:
            - name: PORT
              value: "8080"
            - name: ADMIN_PORT
              value: "8081"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hw2-app
  labels:
    app: hw2-app
spec:
  type: NodePort
  selector:
    app: hw2-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082
